<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuraciones base del documento HTML5 para evitar zoom indeseado en dispositivos moviles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargando Menú...</title>
    
    <!-- Preconexion y descarga de la tipografia principal (Poppins) para asegurar la fidelidad del diseño -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Inyeccion de Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Modificacion dinamica del objeto de configuracion de Tailwind para enlazar colores reactivos inyectados a traves del DOM -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPrimary: 'var(--color-primary, #f97316)',
                        brandSecondary: 'var(--color-secondary, #ef4444)',
                        brandBg: 'var(--color-bg, #111827)',
                    }
                }
            }
        }
    </script>
    
    <!-- Importacion de librerias core de la arquitectura: React, ReactDOM y Babel compilador -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    
    <!-- SDK de Supabase para lectura de la base de datos PostgreSQL -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <style>
        /* Variables CSS base nativas que seran sobrescritas por React al resolver el endpoint de la tienda */
        :root {
            --color-primary: #f97316;
            --color-secondary: #ef4444;
            --color-bg: #111827;
        }

        /* Estructura del cuerpo principal aplicando tipografia, fondo oscuro e inhibiendo selecciones indeseadas tactiles */
        body { 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: var(--color-bg); 
        }
        
        /* Reglas estandarizadas para ocultar las barras laterales de scroll genericas conservando la propiedad de arrastre vertical */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Declaracion de fotogramas clave para orquestar efectos visuales de entrada fluidos */
        @keyframes fade-in-down { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slide-up { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-down { animation: fade-in-down 0.3s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
        
        /* Modulo grafico del spinner circular de carga mediante el uso de bordes y calculos de rotacion CSS puros */
        .loader { 
            border: 4px solid rgba(255,255,255,0.1); 
            border-top: 4px solid var(--color-primary); 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modulo de animacion glow e iluminacion metalica estandarizados para componentes de texto de alto nivel jerarquico */
        @keyframes electric-glow {
            0% { box-shadow: 0 0 5px #fff, 0 0 10px #facc15, 0 0 20px #f97316; border-color: #ffffff; }
            50% { box-shadow: 0 0 20px #fff, 0 0 30px #facc15, 0 0 50px #ef4444; border-color: #fef08a; }
            100% { box-shadow: 0 0 5px #fff, 0 0 10px #facc15, 0 0 20px #f97316; border-color: #ffffff; }
        }
        .logo-electric { border-width: 6px; border-style: solid; animation: electric-glow 1.5s infinite alternate ease-in-out; }
        
        @keyframes shine-metal { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .text-metal-shine {
            background: linear-gradient(to right, #ca8a04 0%, #facc15 30%, #ffffff 50%, #facc15 70%, #ca8a04 100%);
            background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
            animation: shine-metal 3s linear infinite; text-shadow: 0px 2px 4px rgba(0,0,0,0.3);
        }
        
        /* Comportamiento fluido nativo en anclajes internos del navegador */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="min-h-screen pb-10 text-white">

    <!-- Div contenedor centralizado donde el DOM Virtual de React tomara control -->
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        // Importacion de los hooks basicos del motor React
        const { useState, useEffect } = React;

        // Captura del parametro de URL para direccionar las consultas al comercio especifico en base de datos
        const urlParams = new URLSearchParams(window.location.search);
        const TIENDA_ID = parseInt(urlParams.get('tienda')) || 1;

        // Parametros de configuracion e instanciacion global del objeto conector a Supabase
        const SUPABASE_URL = 'https://srhdgocsmswxidrwguhc.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_pWKDoEBfP3l2ggqYh_l7IA_SNq1Esfz'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Modulo React Main App que controla logica, renderizado condicional y peticiones de red
        const App = () => {
            // Evaluadores locales del ciclo de vida de los datos y el estado de la carga de red
            const [tienda, setTienda] = useState(null);
            const [imagenes, setImagenes] = useState([]);
            const [loading, setLoading] = useState(true);

            // Efecto secundario disparado en el montaje para capturar datos vitales de configuracion e inventariado visual
            useEffect(() => {
                const fetchTienda = async () => {
                    try {
                        const { data, error } = await supabase.from('tiendas').select('*').eq('id', TIENDA_ID).single();
                        
                        if (error) throw error;
                        
                        if (data) {
                            setTienda(data);
                            document.title = `Menú | ${data.nombre}`;
                            
                            // Transformacion en cascada inyectando la paleta de colores del backoffice hacia el CSS local
                            if (data.color_primario) document.documentElement.style.setProperty('--color-primary', data.color_primario);
                            if (data.color_fondo) document.documentElement.style.setProperty('--color-bg', data.color_fondo);

                            // Algoritmo extractor de matriz. Transforma un string separado por comas en un Array sanitizado libre de vacios o espacios extra
                            if (data.menu_imagenes_url) {
                                const urlsArray = data.menu_imagenes_url.split(',').map(url => url.trim()).filter(url => url.length > 0);
                                setImagenes(urlsArray);
                            }
                        }
                    } catch (err) {
                        console.error("Error cargando el menú de imágenes:", err);
                    } finally {
                        setLoading(false);
                    }
                };
                
                fetchTienda();
            }, []);

            // Interceptor de renderizado que despliega una ui transitoria circular mientras la peticion REST se cumple
            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

            // Interceptor de error terminal que advierte la carencia de datos o inexistencia de comercio
            if (!tienda) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 text-center">
                        <div className="bg-red-900/40 border border-red-500 p-6 rounded-2xl max-w-sm animate-fade-in-down">
                            <h2 className="text-xl font-bold mb-2">Tienda no encontrada</h2>
                            <a href={`index.html?tienda=${TIENDA_ID}`} className="text-gray-300 text-sm underline hover:text-white transition-colors">Volver al inicio</a>
                        </div>
                    </div>
                );
            }

            // Renderizado visual resolutorio que pinta el modulo final usando la logica reactiva
            return (
                <div className="animate-fade-in-down">
                    
                    {/* Elemento bloque cabecera con fijacion magnetica (sticky) en el top-0 mediante calculo de transparencia Hex */}
                    <div className="sticky top-0 backdrop-blur-xl p-4 text-center z-50 border-b border-gray-800 shadow-lg" style={{ backgroundColor: 'var(--color-bg)CC' }}>
                        <h1 className="font-black text-2xl tracking-widest uppercase drop-shadow-md" style={{ color: tienda.color_primario || '#f97316' }}>
                            NUESTRO MENÚ
                        </h1>
                        <a href={`index.html?tienda=${TIENDA_ID}`} className="text-gray-400 text-sm font-bold mt-1 inline-block hover:text-white transition-colors">
                            ⬅ Volver al inicio
                        </a>
                    </div>

                    {/* Mapeo iterativo del arreglo de graficos inyectado sobre un modelo flexible de grilla apilada (flex-col) */}
                    <div className="max-w-md mx-auto flex flex-col items-center gap-8 mt-6 px-4">
                        {imagenes.length > 0 ? (
                            imagenes.map((url, index) => (
                                <div key={index} className="w-full flex flex-col gap-3 animate-slide-up">
                                    <img 
                                        src={url} 
                                        alt={`Menú ${tienda.nombre} página ${index + 1}`} 
                                        className="w-full rounded-2xl shadow-2xl border border-gray-700 bg-gray-800 object-cover" 
                                        loading={index === 0 ? "eager" : "lazy"} 
                                    />
                                    
                                    {/* Boton incrustado estaticamente debajo de cada imagen para acceso rapido en cualquier nivel del scroll */}
                                    <a 
                                        href={`menus.html?tienda=${TIENDA_ID}`} 
                                        className="block w-full text-white text-center font-black text-xl py-4 rounded-xl shadow-lg active:scale-95 transition-transform"
                                        style={{ 
                                            background: `linear-gradient(to right, ${tienda.color_primario || '#f97316'}, ${tienda.color_secundario || '#ef4444'})`,
                                            border: `1px solid ${tienda.color_primario || '#f97316'}`
                                        }}
                                    >
                                        🛵 ¡QUIERO PEDIR AHORA!
                                    </a>
                                </div>
                            ))
                        ) : (
                            <div className="text-center py-20 bg-gray-900/50 w-full rounded-2xl border border-gray-800">
                                <p className="text-gray-400 font-medium">Esta tienda aún no ha subido imágenes de su menú.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Inyeccion raiz al DOM virtual del navegador
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
