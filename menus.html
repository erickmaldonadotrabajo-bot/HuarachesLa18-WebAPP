<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuraciones base del documento HTML5 para renderizado responsivo sin zoom forzado -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargando Menú...</title>
    
    <!-- Preconexion y descarga de la tipografia principal para reducir tiempos de renderizado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Inyeccion de Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Modificacion dinamica del objeto de configuracion de Tailwind para soportar variables CSS inyectadas por React -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPrimary: 'var(--color-primary, #f97316)',
                        brandSecondary: 'var(--color-secondary, #ef4444)',
                        brandBg: 'var(--color-bg, #111827)',
                    }
                }
            }
        }
    </script>
    
    <!-- Importacion de librerias de arquitectura: React DOM, React y el compilador en tiempo real Babel -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    
    <!-- SDK Oficial de Supabase para interaccion transaccional y WebSocket con Postgres -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    
    <style>
        /* Estructura del cuerpo principal usando variables dinamicas y configuraciones base */
        body { 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: var(--color-bg); 
        }

        /* Utilidades para esconder la barra de scroll vertical sin perder la funcion de desplazamiento */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Keyframes para orquestar la entrada suave de elementos en el DOM */
        @keyframes fade-in-down { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slide-up { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-down { animation: fade-in-down 0.3s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }

        /* Spinner nativo basado en bordes translucidos */
        .loader { 
            border: 4px solid rgba(255,255,255,0.1); 
            border-top: 4px solid var(--color-primary); 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Efectos visuales de resplandor dinamico para elementos clave como el logotipo */
        @keyframes electric-glow {
            0% { box-shadow: 0 0 5px #fff, 0 0 10px #facc15, 0 0 20px #f97316; border-color: #ffffff; }
            50% { box-shadow: 0 0 20px #fff, 0 0 30px #facc15, 0 0 50px #ef4444; border-color: #fef08a; }
            100% { box-shadow: 0 0 5px #fff, 0 0 10px #facc15, 0 0 20px #f97316; border-color: #ffffff; }
        }
        .logo-electric { 
            border-width: 6px; 
            border-style: solid; 
            animation: electric-glow 1.5s infinite alternate ease-in-out; 
        }

        /* Animacion de degradado metalico para textos destacados */
        @keyframes shine-metal { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .text-metal-shine {
            background: linear-gradient(to right, #ca8a04 0%, #facc15 30%, #ffffff 50%, #facc15 70%, #ca8a04 100%);
            background-size: 200% auto; 
            color: transparent; 
            -webkit-background-clip: text; 
            background-clip: text;
            animation: shine-metal 3s linear infinite; 
            text-shadow: 0px 2px 4px rgba(0,0,0,0.3);
        }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="text-gray-800 min-h-screen text-lg selection:bg-brandPrimary selection:text-white">
    <!-- Contenedor root requerido por ReactDOM para anidar la aplicacion -->
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        // Importacion de modulos base de React
        const { useState, useEffect, useMemo, useCallback, memo } = React;

        // Recuperacion y validacion del parametro URL para el identificador de arrendatario (Tenant ID)
        const urlParams = new URLSearchParams(window.location.search);
        const TIENDA_ID = parseInt(urlParams.get('tienda')) || 1;

        // Definicion de constantes estaticas de red e instanciacion del cliente Supabase
        const SUPABASE_URL = 'https://srhdgocsmswxidrwguhc.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_pWKDoEBfP3l2ggqYh_l7IA_SNq1Esfz'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Algoritmo de Haversine para determinar distancia geodesica en base a dos puntos GPS fijos
        const calculateDistance = (lat1, lon1, lat2, lon2) => { 
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180; 
            const dLon = (lon2 - lon1) * Math.PI / 180; 
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; 
        };
        
        // Factory memoizado para renderizacion estricta y veloz de graficos vectoriales (SVG)
        const Icon = memo(({ d, size = 28, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d={d} />
            </svg>
        ));

        // Libreria local estatica de iconos asignados a componentes de interfaz
        const Icons = {
            Cart: (p) => <svg {...p} width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>, 
            Map: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>, 
            Check: (p) => <Icon {...p} d="M20 6L9 17l-5-5" />, 
            Plus: (p) => <Icon {...p} d="M12 5v14M5 12h14" />, 
            Minus: (p) => <Icon {...p} d="M5 12h14" />, 
            Send: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>, 
            Info: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>, 
            Cash: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><line x1="12" y1="7" x2="12" y2="21"></line><path d="M16.5 13.5h.01"></path><path d="M7.5 13.5h.01"></path></svg>, 
            Phone: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>, 
            Card: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>, 
            Search: (p) => <svg {...p} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>, 
            Clock: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>, 
            X: (p) => <svg {...p} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> 
        };

        // Envoltorio de botones reutilizables con estilos preconfigurados segun su nivel de impacto
        const Button = memo(({ onClick, children, variant = "primary", className = "", disabled = false, icon: IconComp }) => { 
            const variants = { 
                primary: "bg-gradient-to-r from-brandPrimary to-brandSecondary text-white shadow-lg active:scale-95 hover:brightness-110 disabled:opacity-50 disabled:pointer-events-none", 
                secondary: "bg-gray-800 text-white hover:bg-gray-700", 
                danger: "bg-red-100 text-red-800 border border-red-200" 
            }; 
            return ( 
                <button 
                    type="button" 
                    onClick={onClick} 
                    disabled={disabled} 
                    className={`px-6 py-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all text-lg ${variants[variant]} ${className}`}
                > 
                    {IconComp && <IconComp size={28} />} {children} 
                </button> 
            ); 
        });

        // Modulo logico y visual que representa un item individual del menu, controlando su estado de agregados, costos e ingredientes removibles
        const ProductItem = memo(({ item, category, onAdd, config }) => {
            const [withExtra, setWithExtra] = useState(false);
            const [conTodo, setConTodo] = useState(true);
            const [exclusions, setExclusions] = useState({});
            
            // Constantes computadas de logica de precios segun la interaccion actual
            const isAvailable = item.disponible;
            const extraPrice = parseFloat(item.extra_precio || 0);
            const hasExtra = item.has_extra && extraPrice > 0 && isAvailable;
            const currentPrice = hasExtra && withExtra ? parseFloat(item.precio) + extraPrice : parseFloat(item.precio);
            const availableToppings = useMemo(() => category.removables || [], [category]);
            
            // Re-hidratacion local si el prop de componente padre sufre cambios
            useEffect(() => { 
                setConTodo(true); 
                setExclusions({}); 
            }, [item.nombre]);
            
            // Callbacks orquestadores para intercepcion de clics en las interfaces de ingredientes, evitando la mutacion directa
            const toggleConTodo = useCallback(() => { 
                if (!conTodo) { 
                    setConTodo(true); 
                    setExclusions({}); 
                } 
            }, [conTodo]);
            
            const toggleExclusion = useCallback((topping) => { 
                setExclusions(prev => { 
                    const newState = !prev[topping]; 
                    const newExclusions = { ...prev, [topping]: newState }; 
                    const anyExcluded = Object.values(newExclusions).some(val => val === true); 
                    setConTodo(!anyExcluded); 
                    return newExclusions; 
                }); 
            }, []);
            
            // Procedimiento generador de payloads que construye una cadena pre-formateada de notas antes de pasarlo a la funcion superior onAdd
            const handleAdd = useCallback(() => { 
                let details = ""; 
                const activeExclusions = Object.entries(exclusions).filter(([_, isExcluded]) => isExcluded).map(([name]) => name); 
                
                if (availableToppings.length === 0) details = ""; 
                else if (conTodo) details = " (Con Todo)"; 
                else if (activeExclusions.length === availableToppings.length) details = " (SIN NADA / SOLO)"; 
                else if (activeExclusions.length > 0) details = ` (SIN ${activeExclusions.join(', SIN ')})`; 
                else details = " (Con Todo)"; 
                
                onAdd({ 
                    ...item, 
                    name: item.nombre, 
                    price: currentPrice, 
                    isExtra: withExtra, 
                    extraAppliedName: withExtra ? item.extra_name : '', 
                    details: details 
                }); 
            }, [exclusions, conTodo, availableToppings, onAdd, item, currentPrice, withExtra]);

            return (
                <div className={`bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col animate-slide-up h-full ${!isAvailable ? 'opacity-60 bg-gray-100' : ''}`}>
                    <div className="p-2 flex-grow">
                        <div className="flex justify-between items-start mb-4">
                            <h3 className="font-bold text-gray-900 text-xl leading-tight">{item.nombre}</h3>
                            <div className="flex flex-col items-end">
                                <span className="bg-orange-50 text-brandPrimary px-3 py-1 rounded-lg font-bold text-lg whitespace-nowrap ml-2 border border-brandPrimary/20">
                                    ${currentPrice.toFixed(2)}
                                </span>
                                {!isAvailable && <span className="text-xs bg-red-600 text-white px-2 py-1 rounded mt-1 font-bold">AGOTADO</span>}
                            </div>
                        </div>

                        {/* Modulo dinamico "Personalizar" (Oculto si el item no admite modificaciones o si esta deshabilitado) */}
                        {isAvailable && availableToppings.length > 0 && (
                            <div className="mb-4 flex flex-col gap-2">
                                <p className='text-sm text-gray-500 mb-1 font-semibold'>Personalizar:</p>
                                
                                <label className="flex items-center gap-3 text-base font-bold text-gray-900 cursor-pointer select-none p-2 rounded bg-gray-50 border border-gray-200 hover:bg-gray-100 transition-colors">
                                    <input type="checkbox" checked={conTodo} onChange={toggleConTodo} className="w-5 h-5 rounded" style={{accentColor: config.color_primario}} />
                                    Con Todo
                                </label>
                                
                                <div className="grid grid-cols-2 gap-2 mt-1">
                                    {availableToppings.map(t => ( 
                                        <label key={t} className={`flex items-center gap-2 text-sm cursor-pointer select-none p-2 rounded border transition-colors ${exclusions[t] ? 'bg-red-50 border-red-200 text-red-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'}`}>
                                            <input type="checkbox" checked={exclusions[t] || false} onChange={() => toggleExclusion(t)} className="w-4 h-4 rounded" style={{accentColor: '#dc2626'}} />
                                            Sin {t}
                                        </label> 
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Modulo selector en formato div clickeable que activa un agregado comercial complementario (upsell secundario local) */}
                        {hasExtra && ( 
                            <div onClick={() => setWithExtra(!withExtra)} role="button" tabIndex="0" className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer mb-4 transition-all ${withExtra ? 'border-brandPrimary bg-orange-50 ring-1 ring-brandPrimary' : 'border-gray-200 bg-gray-50 hover:bg-gray-100'}`}>
                                <div className={`w-6 h-6 rounded border flex items-center justify-center ${withExtra ? 'bg-brandPrimary border-brandPrimary' : 'bg-white border-gray-400'}`}>
                                    {withExtra && <Icons.Check size={16} className="text-white" />}
                                </div>
                                <span className="text-base font-medium text-gray-800">{item.extra_name} (+${extraPrice})</span>
                            </div> 
                        )}
                    </div>
                    
                    {/* Boton invocador final que propaga la respuesta en cascada hacia el objeto general App */}
                    <div className="p-4 pt-0 mt-auto">
                        <Button onClick={handleAdd} disabled={!isAvailable} className="w-full text-lg py-3 hover:brightness-110 active:scale-95" icon={Icons.Plus}>
                            {isAvailable ? 'Agregar' : 'No disponible'}
                        </Button>
                    </div>
                </div>
            );
        });

        // Contenedor Logico Superior: Controla el flujo completo del cliente y la inicializacion con Base de Datos
        const App = () => {
            // Este bloque de estados primitivos evalua el ciclo de red transaccional para evitar lecturas sobre vacios durante la hidratacion del cliente
            const [storeConfig, setStoreConfig] = useState(null);
            const [categoriesDB, setCategoriesDB] = useState([]);
            const [menuItemsDB, setMenuItemsDB] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [errorLoad, setErrorLoad] = useState(false);
            
            // Rutina de fetch relacional anidado
            useEffect(() => {
                const fetchStoreData = async () => {
                    try {
                        const { data: tienda, error: errTienda } = await supabase.from('tiendas').select('*').eq('id', TIENDA_ID).single();
                        if (errTienda || !tienda) throw new Error("Tienda no encontrada");
                        
                        setStoreConfig(tienda);
                        
                        document.title = `${tienda.nombre} | Menú Digital`;
                        document.documentElement.style.setProperty('--color-primary', tienda.color_primario);
                        document.documentElement.style.setProperty('--color-secondary', tienda.color_secundario);
                        document.documentElement.style.setProperty('--color-bg', tienda.color_fondo);

                        const { data: cats } = await supabase.from('categorias').select('*').eq('tienda_id', TIENDA_ID).order('orden', { ascending: true });
                        setCategoriesDB(cats || []);
                        if (cats && cats.length > 0) setActiveCategory(cats[0].nombre);

                        const { data: items } = await supabase.from('menu_items').select('*').eq('tienda_id', TIENDA_ID).order('orden', { ascending: true });
                        setMenuItemsDB(items || []);

                    } catch (err) {
                        console.error("Error cargando SaaS:", err);
                        setErrorLoad(true);
                    } finally {
                        setIsLoading(false);
                    }
                };
                
                fetchStoreData();

                // Establecimiento de subscripcion persistente Web Socket para refrescar en pantalla cierres forzados por el administrador
                const channel = supabase.channel('public:tiendas')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tiendas', filter: `id=eq.${TIENDA_ID}` }, payload => {
                        setStoreConfig(prev => ({...prev, abierto: payload.new.abierto}));
                    }).subscribe();
                    
                return () => { supabase.removeChannel(channel); };
            }, []);

            // Desglose de estado interno enfocado en el manejo interactivo, metadatos y estados modales del flujo actual
            const [whatsappFallbackUrl, setWhatsappFallbackUrl] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitText, setSubmitText] = useState("Confirmar Orden");
            const [cartAnimate, setCartAnimate] = useState(false);
            const [cart, setCart] = useState([]);
            const [activeCategory, setActiveCategory] = useState("");
            const [showCart, setShowCart] = useState(false);
            const [notification, setNotification] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");
            const [showWaitModal, setShowWaitModal] = useState(false);
            const [showDrinkUpsell, setShowDrinkUpsell] = useState(false);
            
            // Segmentacion especifica de estados logicos para geolocalizacion, tipos de ruteo local (delivery/pickup) e inicializacion perezosa
            const [orderType, setOrderType] = useState('delivery'); 
            const [location, setLocation] = useState({ lat: null, lng: null, status: 'idle', shippingCost: 0, zoneName: '', distance: 0, allowed: false });
            
            // Optimizacion con callbacks pasadas a UseState para cargar de inmediato los strings JSON ubicados en localStorage al inicio
            const [customer, setCustomer] = useState(() => {
                const saved = localStorage.getItem(`saasClient_${TIENDA_ID}`);
                if (saved) return { ...JSON.parse(saved), customAnswers: {}, paymentAmount: '', instructions: '', tip: '' };
                return { name: '', phone: '', customAnswers: {}, paymentMethod: '', paymentAmount: '', instructions: '', tip: '' };
            });

            // Tres observadores (useEffect) que respaldan y reflejan cualquier mutacion de datos en el cliente en la memoria permanente LocalStorage
            useEffect(() => { localStorage.setItem(`saasClient_${TIENDA_ID}`, JSON.stringify({ name: customer.name, phone: customer.phone, paymentMethod: customer.paymentMethod })); }, [customer.name, customer.phone, customer.paymentMethod]);
            useEffect(() => { const saved = localStorage.getItem(`saasCart_${TIENDA_ID}`); if (saved) try { setCart(JSON.parse(saved)); } catch (e) {} }, []);
            useEffect(() => { localStorage.setItem(`saasCart_${TIENDA_ID}`, JSON.stringify(cart)); }, [cart]);

            // Callbacks operativas secundarias para mutaciones locales de objetos y despliegue transitorio de ventanas flotantes toast
            const handleCustomAnswer = (fieldId, value) => { setCustomer(prev => ({ ...prev, customAnswers: { ...prev.customAnswers, [fieldId]: value } })); };
            const showNotification = useCallback((msg) => { setNotification(msg); setTimeout(() => setNotification(null), 2500); }, []); 
            
            // Modulo transaccional virtual que anexa un item nuevo al carrito o incrementa la cantidad (qty) combinando strings para deteccion (key)
            const addToCart = useCallback((product) => { 
                const key = `${product.nombre}-${product.price}-${product.details}-${product.isExtra}`; 
                setCart(prev => { 
                    const existingIndex = prev.findIndex(p => p.key === key); 
                    if (existingIndex > -1) { 
                        const newCart = [...prev]; 
                        newCart[existingIndex].qty += 1; 
                        return newCart; 
                    } 
                    return [...prev, { ...product, qty: 1, key }]; 
                }); 
                showNotification(`¡${product.nombre}${product.isExtra ? ` (${product.extraAppliedName})` : ""} agregado!`); 
                setCartAnimate(true); 
                setTimeout(() => setCartAnimate(false), 300);
            }, [showNotification]);
            
            // Función generica y pura encargada unicamente de procesar el decremento e incremento sin mutar el array original (via map y filter)
            const updateQty = useCallback((key, delta) => { 
                setCart(prev => prev.map(p => p.key === key ? { ...p, qty: Math.max(0, p.qty + delta) } : p).filter(p => p.qty > 0)); 
            }, []);

            // Solicitante transaccional interactivo hacia el modulo nativo Geolocation del navegador para evaluar distancia en matriz comparativa de rangos de costo
            const requestLocation = () => {
                if (!navigator.geolocation) return setLocation(prev => ({ ...prev, status: 'error' }));
                
                if(!confirm(`📍 Necesitamos verificar tu zona de entrega.\n\nACEPTAR para continuar.`)) return;
                
                setLocation(prev => ({ ...prev, status: 'loading' }));
                
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const distKm = calculateDistance(storeConfig.latitud, storeConfig.longitud, pos.coords.latitude, pos.coords.longitude);
                        
                        if (distKm > storeConfig.max_delivery_radius) {
                            setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude, status: 'success', allowed: false, shippingCost: 0, zoneName: 'Fuera de rango', distance: distKm });
                            alert(`⚠️ FUERA DE COBERTURA\nEstás a ${distKm.toFixed(2)} km.\nLímite máximo: ${storeConfig.max_delivery_radius} km.`);
                            return;
                        }
                        
                        const matchedTier = storeConfig.delivery_tiers.find(tier => distKm <= tier.maxDistance);
                        
                        if (matchedTier) {
                            setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude, status: 'success', allowed: true, shippingCost: matchedTier.cost, zoneName: matchedTier.name, distance: distKm });
                            showNotification(`✅ Estás en ${matchedTier.name}. Tarifa: $${matchedTier.cost}`);
                        } else {
                            setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude, status: 'success', allowed: false, shippingCost: 0, zoneName: 'Error de tarifa', distance: distKm });
                            alert(`⚠️ Algo salió mal al calcular la tarifa.`);
                        }
                    },
                    (err) => { 
                        setLocation(prev => ({ ...prev, status: 'error' })); 
                        showNotification("⚠️ No pudimos obtener tu ubicación."); 
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 300000 }
                );
            };

            // Metodo optimizado (hook useMemo) que consolida variables computadas de dinero, evaluando arrays sin procesarlos multiples veces 
            const totals = useMemo(() => { 
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0); 
                const tip = parseFloat(customer.tip) || 0; 
                const shipping = orderType === 'pickup' ? 0 : (location.allowed ? location.shippingCost : 0);
                let baseTotal = subtotal + shipping + tip; 
                const cardFee = customer.paymentMethod === 'tarjeta' ? baseTotal * parseFloat(storeConfig?.porcentaje_tarjeta || 0) : 0; 
                
                return { subtotal, tip, cardFee, shipping, finalTotal: baseTotal + cardFee }; 
            }, [cart, customer.tip, customer.paymentMethod, orderType, location.allowed, location.shippingCost, storeConfig]);

            // Reseteador que clausura modals visuales intermedios regresando variables a estados primarios
            const closeWaitModal = () => { 
                setShowWaitModal(false); 
                setIsSubmitting(false); 
                setSubmitText("Confirmar Orden"); 
                setWhatsappFallbackUrl(null); 
            };

            // Puerta de bloqueos estructurada que lee y previene ejecuciones si se detectan violaciones a las reglas de negocio (minimos, GPS, variables de telefono)
            const handleCheckout = async () => {
                if (orderType === 'delivery') {
                    if (totals.subtotal < parseFloat(storeConfig.pedido_minimo)) return showNotification(`⚠️ Pedido mínimo: $${storeConfig.pedido_minimo}`);
                    if (location.status === 'idle') return showNotification("⚠️ Valida tu ubicación antes de pedir");
                    if (!location.allowed) return showNotification("⚠️ Fuera de zona a domicilio");
                }
                
                const telefonoLimpio = customer.phone.replace(/[^0-9]/g, '');
                
                if (!customer.name || !telefonoLimpio || !customer.paymentMethod || cart.length === 0) return showNotification("⚠️ Faltan datos obligatorios");
                if (telefonoLimpio.length !== 10) return showNotification("⚠️ Teléfono debe ser de 10 dígitos");
                
                if (customer.paymentMethod === 'efectivo') {
                    const payAmount = parseFloat(customer.paymentAmount) || 0;
                    if (payAmount < totals.finalTotal) return showNotification(`⚠️ El pago debe cubrir el total de $${totals.finalTotal.toFixed(2)}`);
                }

                // Sub-algoritmo tactico de ventas (Upsell). Escanea el ticket local para detectar omisiones sobre categorias marcadas en Backoffice y redirige si no coinciden
                if (storeConfig.upsell_config?.enabled) {
                    const targetCat = categoriesDB.find(c => c.nombre === storeConfig.upsell_config.targetCategoryName);
                    if (targetCat) {
                        const hasTargetItem = cart.some(item => item.categoria_id === targetCat.id);
                        if (!hasTargetItem) {
                            setShowDrinkUpsell(true);
                            return; 
                        }
                    }
                }

                setWhatsappFallbackUrl(null);
                setShowWaitModal(true);
            };

            // Ultima llamada asincrona: Formatea strings finales para lectura humana, inyecta fila estandarizada en Supabase DB y lanza integracion con API WhatsApp nativa
            const confirmAndSend = async () => {
                if (isSubmitting) return; 
                setIsSubmitting(true);
                setSubmitText("🔐 Guardando...");

                const shippingSeguro = orderType === 'pickup' ? 0 : (location.allowed ? location.shippingCost : 0);
                const tipSeguro = parseFloat(customer.tip) || 0;
                let baseTotalSeguro = totals.subtotal + shippingSeguro + tipSeguro;
                const cardFeeSeguro = customer.paymentMethod === 'tarjeta' ? baseTotalSeguro * parseFloat(storeConfig.porcentaje_tarjeta) : 0;
                const finalTotalSeguro = baseTotalSeguro + cardFeeSeguro;
                
                const title = orderType === 'pickup' ? "PEDIDO PICKUP" : "PEDIDO A DOMICILIO";
                let msg = `🔥 *${title}* 🔥\n\n👤 *Cliente:* ${customer.name}\n📱 *Tel:* ${customer.phone}\n`;
                
                Object.keys(customer.customAnswers).forEach(key => {
                    const fieldDef = storeConfig.checkout_options.find(f => f.id === key);
                    if (fieldDef && customer.customAnswers[key]) msg += `👉 *${fieldDef.label.replace(/[^a-zA-Z0-9 ]/g, '')}:* ${customer.customAnswers[key]}\n`;
                });

                msg += `--------------------------------\n`;
                cart.forEach(item => { msg += `✅ *${item.qty}* x *${item.nombre}* ${item.isExtra ? '('+item.extraAppliedName+')' : ''} ${item.details || ''}- $${(item.price * item.qty).toFixed(2)}\n`; });
                
                if (customer.instructions) msg += `\n📝 *Notas:* ${customer.instructions}`;
                
                msg += `\n--------------------\n\nSubtotal: $${totals.subtotal.toFixed(2)}\n\n`;
                
                if (orderType === 'delivery') msg += `🛵 Envío: $${shippingSeguro.toFixed(2)} ${location.zoneName ? '('+location.zoneName+')' : ''}\n`;
                else msg += `🛍️ Pickup: Sin costo de envío\n`;
                
                if (tipSeguro > 0) msg += `💸 Propina: *$${tipSeguro.toFixed(2)}*\n\n`;
                
                let pagoInfo = "";
                if (customer.paymentMethod === 'efectivo') {
                    const pagoCon = parseFloat(customer.paymentAmount) || 0;
                    pagoInfo = `EFECTIVO\n (Con: $${pagoCon}) -> *Cambio*: $${(pagoCon - finalTotalSeguro > 0) ? (pagoCon - finalTotalSeguro).toFixed(2) : '0.00'}`;
                } else {
                    pagoInfo = customer.paymentMethod.toUpperCase();
                }

                msg += `*💰 TOTAL: $${finalTotalSeguro.toFixed(2)}*\n\n*Pago:* ${pagoInfo}`;
                
                if (orderType === 'delivery') {
                    if (location.lat && location.lng) {
                        msg += `\n\n📍 *DIRECCIÓN DE ENTREGA:*\n https://www.google.com/maps/search/?api=1&query=${location.lat},${location.lng}`;
                    } else {
                        msg += `\n\n⚠️ Ubicación: PENDIENTE (enviar manualmente)`;
                    }
                }

                const whatsappUrl = `https://wa.me/${storeConfig.telefono_whatsapp}?text=${encodeURIComponent(msg)}`;
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                let preOpenedWindow = null;
                
                if (!isMobile) preOpenedWindow = window.open('', '_blank');

                try {
                    const insertPromise = supabase.from('pedidos').insert([{ 
                        tienda_id: TIENDA_ID, 
                        cliente_nombre: customer.name, 
                        cliente_telefono: customer.phone,
                        tipo_entrega: orderType,
                        metodo_pago: customer.paymentMethod,
                        pago_con: customer.paymentMethod === 'efectivo' ? parseFloat(customer.paymentAmount) : null,
                        latitud: location.lat,
                        longitud: location.lng,
                        total_subtotal: totals.subtotal,
                        total_envio: shippingSeguro,
                        total_comision: cardFeeSeguro,
                        total_propina: tipSeguro,
                        total_final: finalTotalSeguro,
                        detalle_json: cart,
                        respuestas_checkout: customer.customAnswers,
                        nota_cliente: customer.instructions,
                        estado: 'pendiente'
                    }]);
                    
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), 4000));
                    await Promise.race([insertPromise, timeoutPromise]);
                } catch(err) {
                    console.warn("⚠️ Falló guardado DB, enviando a WP de todos modos.", err);
                }

                setCart([]); 
                localStorage.removeItem(`saasCart_${TIENDA_ID}`); 
                setShowCart(false);
                setWhatsappFallbackUrl(whatsappUrl); 
                setSubmitText("Redirigiendo..."); 

                if (!isMobile && preOpenedWindow) preOpenedWindow.location.href = whatsappUrl;
                else window.location.href = whatsappUrl;
            };

            // Filtrado hibrido y reorganizador dependiente; mapea solo los items listados mediante concurrencias activadas en el input de busqueda del usuario o los tabs de categoria
            const processedMenu = useMemo(() => {
                let activeCats = categoriesDB;
                
                if (!searchTerm && activeCategory) activeCats = categoriesDB.filter(c => c.nombre === activeCategory);
                
                return activeCats.map(cat => {
                    let catItems = menuItemsDB.filter(item => item.categoria_id === cat.id && item.nombre.toLowerCase().includes(searchTerm.toLowerCase()));
                    catItems.sort((a, b) => a.orden - b.orden);
                    return { id: cat.id, category: cat.nombre, prepNote: cat.nota_preparacion, removables: cat.removables, items: catItems };
                }).filter(cat => cat.items.length > 0 || searchTerm); 
            }, [categoriesDB, menuItemsDB, searchTerm, activeCategory]);

            // Invocador nativo al engine del navegador web para autodesplazamiento vertical pasivo ante repintado general de componente
            useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [activeCategory]);

            // =====================================================================
            // CONDICIONALES DE BLOQUEO DE FLUJO VISUAL 
            // =====================================================================
            
            // Bypass que suspende renderizacion final si resoluciones transaccionales asincronas del arranque no han terminado
            if (isLoading) return <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center"><div className="loader mb-4"></div><p className="text-gray-400">Cargando restaurante...</p></div>;
            
            // Bypass visual disparado por error severo que aborta la app si el backend es irresoluble para el Id actual 
            if (errorLoad) return <div className="min-h-screen bg-gray-900 flex items-center justify-center p-6 text-center"><div className="bg-red-900/50 border border-red-500 p-6 rounded-2xl"><h2 className="text-2xl text-white font-bold mb-2">Error de conexión</h2><p className="text-gray-300">No pudimos cargar la información de la tienda. Verifica el ID.</p></div></div>;

            // Renderizado completo de escape si base de datos confirma un flag transitorio manual alterado por los operadores en admin panel
            if (!storeConfig.abierto) {
                  return (
                    <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-6 text-center animate-fade-in-down">
                        <div className="mb-10 relative">
                            <div className="absolute inset-0 bg-red-500 blur-2xl opacity-20 rounded-full"></div>
                            <img src={storeConfig.logo_url} className="w-40 h-40 sm:h-48 sm:w-48 rounded-full shadow-2xl logo-electric relative z-10 grayscale object-cover" />
                        </div>
                        <h1 className="text-3xl font-black text-white mb-4 tracking-widest uppercase">CERRADO</h1>
                        <p className="text-gray-400 text-lg">{storeConfig.mensaje_cerrado}</p>
                    </div>
                  );
            }

            // =====================================================================
            // RENDERIZADO VISUAL - TIENDA ABIERTA (MAIN LAYOUT)
            // =====================================================================
            return (
                <div className={`relative min-h-screen bg-gradient-to-br ${orderType === 'pickup' ? 'from-purple-500 via-fuchsia-600 to-indigo-900' : 'from-yellow-400 via-orange-500 to-red-600'} pb-24 text-base transition-colors duration-700`}>
                    
                    {/* Componente Header general con logo estatico, selector de vista logica local y barra incrustada */}
                    <div className={`fixed inset-0 z-0 ${orderType === 'pickup' ? 'bg-purple-800' : 'bg-orange-500'} pointer-events-none`}>
                        <div className="absolute inset-0 bg-cover bg-center opacity-20 mix-blend-overlay transition-opacity duration-700" style={{ backgroundImage: `url(${storeConfig.logo_url})` }} />
                    </div>

                    <header className={`bg-black/90 backdrop-blur-md shadow-2xl border-b-4 ${orderType === 'pickup' ? 'border-fuchsia-500' : 'border-orange-600'} rounded-b-3xl mx-auto max-w-2xl px-4 py-8 text-center z-50 relative transition-colors duration-700 flex flex-col items-center`}>
                        
                        <img src={storeConfig.logo_url} className="h-40 w-40 sm:h-48 sm:w-48 rounded-full logo-electric mb-4 relative z-10 object-cover" loading="eager" />
                        <h1 className="text-3xl font-black text-metal-shine tracking-widest drop-shadow-sm mb-6">{storeConfig.nombre}</h1>
                        
                        {/* Contenedor encapsulado emulando tabs para switcheo entre logica de pedido delivery / pickup */}
                        <div className="bg-gray-900 p-1.5 rounded-full flex gap-1 border border-gray-700 shadow-inner w-full max-w-sm mb-5">
                            <button 
                                onClick={() => setOrderType('delivery')}
                                className={`flex-1 py-2.5 rounded-full font-bold text-sm sm:text-base transition-all duration-300 ${orderType === 'delivery' ? 'bg-gradient-to-r from-orange-500 to-red-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
                            >
                                🛵 Domicilio
                            </button>
                            <button 
                                onClick={() => setOrderType('pickup')}
                                className={`flex-1 py-2.5 rounded-full font-bold text-sm sm:text-base transition-all duration-300 ${orderType === 'pickup' ? 'bg-gradient-to-r from-purple-500 to-fuchsia-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
                            >
                                🛍️ Pickup
                            </button>
                        </div>

                        <a 
                            href={`https://www.google.com/maps/search/?api=1&query=${storeConfig.latitud},${storeConfig.longitud}`} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="inline-flex items-center justify-center gap-2 bg-white/10 hover:bg-white/20 text-white px-6 py-3 rounded-xl font-bold border border-white/20 transition-colors shadow-sm mb-5 w-full max-w-xs"
                        >
                            <Icons.Map size={22} />
                            Ver nuestra ubicación
                        </a>

                        {/* Indicador UI interactivo derivado del tipo de delivery elegido actualmente en el state */}
                        {orderType === 'delivery' && (
                            <div className="bg-orange-500/20 border border-orange-500/50 text-orange-200 px-5 py-3 rounded-xl inline-flex items-center gap-2 text-sm sm:text-base font-bold shadow-sm">
                                <Icons.Clock size={20} className="text-orange-400"/> 
                                Tiempo de entrega: 45 a 60 min
                            </div>
                        )}
                        {orderType === 'pickup' && (
                            <div className="bg-fuchsia-500/20 border border-fuchsia-500/50 text-fuchsia-200 px-5 py-3 rounded-xl inline-flex items-center gap-2 text-sm sm:text-base font-bold shadow-sm">
                                <Icons.Clock size={20} className="text-fuchsia-400"/> 
                                Pasa a recoger en mostrador
                            </div>
                        )}
                    </header>

                    <main className="max-w-4xl mx-auto p-4 relative z-10 mt-4">
                        
                        {/* Contenedor relativo de barra de busqueda vinculando onChange con el modulo de filtrado inferior */}
                        <div className="sticky top-0 z-40 -mx-4 pt-4 bg-gradient-to-b from-black/60 to-transparent backdrop-blur-sm mb-4 pb-2">
                            <div className="px-4 pb-4 max-w-lg mx-auto">
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icons.Search className="text-gray-400" /></div>
                                    <input type="text" placeholder="Buscar en el menú..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-gray-900/80 text-white pl-10 pr-4 py-3 rounded-2xl border border-gray-600 focus:border-orange-500 outline-none shadow-lg" />
                                    {searchTerm && (<button onClick={() => setSearchTerm('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400">✕</button>)}
                                </div>
                            </div>
                            
                            {/* Renderizador de capsulas horizontales desplazables que actuan sobre el renderizado parcializado de categorias de productos */}
                            {!searchTerm && ( 
                                <div className="flex flex-wrap justify-center gap-2 pb-4 px-4">
                                    {categoriesDB.map(cat => ( 
                                        <button 
                                            key={cat.id} 
                                            onClick={() => setActiveCategory(cat.nombre)} 
                                            className={`whitespace-nowrap px-4 py-2 rounded-full font-bold text-base transition-all transform active:scale-95 shadow-md ${activeCategory === cat.nombre ? 'bg-orange-600 text-white scale-105 border-2 border-orange-300' : 'bg-black/60 text-white border border-white/20 hover:bg-orange-500'}`}
                                        >
                                            {cat.nombre}
                                        </button> 
                                    ))}
                                </div> 
                            )}
                        </div>

                        {/* Motor principal del DOM mapeando el objeto pre-parseado a bloques UI independientes de categorias y sus arreglos secundarios de items */}
                        {processedMenu.map(cat => (
                            <div key={cat.id} id={`cat-${cat.id}`} className="animate-slide-up min-h-[20vh] mb-12">
                                <h2 className="text-white font-bold text-2xl mb-4 pl-2 border-l-4 border-orange-500 drop-shadow-md">{cat.category}</h2>
                                {cat.prepNote && !searchTerm && (
                                    <div className="bg-white/90 backdrop-blur-sm border-l-4 border-orange-500 p-3 rounded-r-lg mb-4 flex items-center gap-2 text-sm shadow-lg">
                                        <Icons.Info className="text-orange-500 flex-shrink-0" size={20} />
                                        <p className="italic text-gray-800 font-medium">{cat.prepNote}</p>
                                    </div>
                                )}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    {cat.items.map((item) => (<ProductItem key={item.id} item={item} category={cat} onAdd={addToCart} config={storeConfig}/>))}
                                </div>
                            </div>
                        ))}

                        {/* =========================================================== */}
                        {/* CONTENEDOR CHECKOUT INCRUSTADO AL PIE - SE ACTIVA VIA POSICIONES TRASLADADAS SEGUN STATE */}
                        {/* =========================================================== */}
                        <div id="cart" className={`transition-all duration-500 transform ${cart.length > 0 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-20 h-0 overflow-hidden'}`}>
                            {cart.length > 0 && (
                                <div className="mt-10 bg-white rounded-3xl shadow-2xl overflow-hidden border-t-4 border-orange-500">
                                    <div className="bg-gray-900 p-6 flex items-center gap-3 text-white">
                                        <Icons.Cart className="text-orange-500" size={32} />
                                        <h2 className="font-bold text-2xl">Tu Pedido ({orderType === 'pickup' ? 'PICKUP' : 'DOMICILIO'})</h2>
                                    </div>
                                    
                                    {/* Mapeo del arreglo de objetos en cart[] traduciendolos al listado con inputs reactivos de actualizacion de cantidasades */}
                                    <div className="p-6 max-h-[500px] overflow-y-auto custom-scrollbar space-y-4">
                                        {cart.map(item => ( 
                                            <div key={item.key} className="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
                                                <div className="flex items-center gap-4">
                                                    <span className="bg-orange-100 text-orange-800 font-bold w-10 h-10 flex items-center justify-center rounded-lg text-lg">{item.qty}</span>
                                                    <div>
                                                        <p className="font-bold text-gray-900 text-lg leading-tight">{item.nombre}</p>
                                                        <p className="text-sm text-gray-600 mt-1">{item.details}</p>
                                                        <p className="text-base text-gray-800 font-bold mt-1">${item.price} {item.isExtra && `(+${item.extraAppliedName})`}</p>
                                                    </div>
                                                </div>
                                                <div className="flex gap-3">
                                                    <button onClick={() => updateQty(item.key, -1)} className="p-3 bg-white border rounded-lg text-gray-500 hover:text-red-500 active:bg-gray-100"><Icons.Minus size={20} /></button>
                                                    <button onClick={() => updateQty(item.key, 1)} className="p-3 bg-orange-500 text-white rounded-lg shadow-md active:bg-orange-600"><Icons.Plus size={20} /></button>
                                                </div>
                                            </div> 
                                        ))}
                                    </div>

                                    {/* Division final donde se inyectan variables de contacto e iteraciones jsonb provenientes del configurador en backend */}
                                    <div className="bg-gray-50 p-6 border-t space-y-6">
                                        
                                        <h3 className="font-bold text-gray-600 text-base uppercase flex items-center gap-2"><Icons.Map size={24} /> Datos de Entrega</h3>
                                        <input type="text" placeholder="Nombre Completo" value={customer.name} onChange={e=>setCustomer({...customer, name:e.target.value})} className="w-full p-4 bg-white border rounded-xl text-lg shadow-sm" />
                                        <input type="tel" placeholder="Número de Teléfono" value={customer.phone} onChange={e=>setCustomer({...customer, phone:e.target.value})} className="w-full p-4 bg-white border rounded-xl text-lg shadow-sm" />
                                        
                                        {/* Generador de preguntas JSON dinamico desde Supabase */}
                                        {storeConfig.checkout_options && storeConfig.checkout_options.map(field => (
                                            <div key={field.id} className="space-y-2">
                                                <p className="text-sm font-bold text-gray-500 uppercase ml-1">{field.label}</p>
                                                <div className="grid grid-cols-2 gap-3">
                                                    {field.options.map(opt => (
                                                        <button 
                                                            key={opt} 
                                                            type="button" 
                                                            onClick={() => handleCustomAnswer(field.id, opt)} 
                                                            className={`py-3 px-2 rounded-xl text-sm font-bold border-2 transition-all active:scale-95 flex items-center justify-center gap-2 ${customer.customAnswers[field.id] === opt ? 'bg-orange-100 border-orange-500 text-orange-700 shadow-sm' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`}
                                                        >
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}

                                        <textarea className="w-full p-4 bg-white border border-gray-300 rounded-xl text-lg shadow-sm" placeholder="Instrucciones adicionales..." rows="2" value={customer.instructions} onChange={e => setCustomer({...customer, instructions: e.target.value})} />
                                        
                                        {/* Disparador asincrono que interactua via hooks localizadores para la evaluacion logica de envios dinamicos */}
                                        {orderType === 'delivery' && (
                                            <div className="space-y-2">
                                                <Button 
                                                    onClick={requestLocation} 
                                                    variant={location.status === 'success' ? (location.allowed ? 'primary' : 'danger') : 'secondary'} 
                                                    className={`w-full text-base py-4 ${location.status === 'success' && location.allowed ? 'bg-green-600' : ''}`} 
                                                    icon={Icons.Map}
                                                >
                                                    {location.status === 'loading' ? '📍 Buscando...' : location.status === 'success' ? (location.allowed ? `✅ ${location.zoneName} ($${location.shippingCost})` : `🚫 Fuera de Rango`) : '📍 Calcular Tarifa de Envío'}
                                                </Button>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-3 gap-4">
                                            {['efectivo', 'transferencia', 'tarjeta'].map(m => ( 
                                                <button 
                                                    key={m} 
                                                    onClick={() => setCustomer({...customer, paymentMethod: m})} 
                                                    className={`py-4 rounded-xl text-sm font-bold uppercase border flex flex-col items-center gap-2 ${customer.paymentMethod === m ? 'bg-gray-800 text-white' : 'bg-white text-gray-600'}`}
                                                >
                                                    {m === 'efectivo' && <Icons.Cash size={28} />} 
                                                    {m === 'transferencia' && <Icons.Phone size={28} />} 
                                                    {m === 'tarjeta' && <Icons.Card size={28} />} 
                                                    {m}
                                                </button> 
                                            ))}
                                        </div>
                                        
                                        {/* Condicionales que revelan detalles bancarios y peticion de recuento en efectivo para devoluciones justas */}
                                        {customer.paymentMethod === 'efectivo' && (
                                            <div className="space-y-3 bg-green-50 p-4 rounded-xl border border-green-200">
                                                <p className="text-sm font-bold text-green-800 uppercase ml-1">💵 ¿Con cuánto vas a pagar?</p>
                                                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                                    <button type="button" onClick={() => setCustomer({...customer, paymentAmount: totals.finalTotal})} className="whitespace-nowrap px-4 py-2 bg-green-600 text-white font-bold rounded-lg shadow-sm hover:bg-green-700 active:scale-95 transition-all">Exacto</button>
                                                    {Array.from(new Set([ Math.ceil((totals.finalTotal + 1) / 50) * 50, Math.ceil((totals.finalTotal + 1) / 100) * 100, Math.ceil((totals.finalTotal + 1) / 200) * 200, Math.ceil((totals.finalTotal + 1) / 500) * 500 ])).sort((a,b)=>a-b).slice(0, 3).map(amount => ( 
                                                        <button key={amount} type="button" onClick={() => setCustomer({...customer, paymentAmount: amount})} className="whitespace-nowrap px-4 py-2 bg-white text-green-700 font-bold rounded-lg border border-green-300 shadow-sm hover:bg-green-50 active:scale-95 transition-all">${amount}</button> 
                                                    ))}
                                                </div>
                                                <div className="relative">
                                                    <span className="absolute left-4 top-4 text-green-600 font-bold text-lg">$</span>
                                                    <input type="number" placeholder="Otro monto..." value={customer.paymentAmount} onChange={e=>setCustomer({...customer, paymentAmount:e.target.value})} className="w-full p-4 pl-8 border-2 border-green-400 bg-white rounded-xl text-lg font-bold text-gray-900 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-200 transition-all shadow-inner" />
                                                </div>
                                            </div>
                                        )}
                                        {customer.paymentMethod === 'transferencia' && (
                                            <div className="p-5 bg-blue-50 border border-blue-200 rounded-xl text-blue-900">
                                                <p className="font-bold mb-2">DATOS BANCARIOS:</p>
                                                <p className="font-mono whitespace-pre-wrap select-all">{storeConfig.datos_bancarios}</p>
                                            </div>
                                        )}
                                        
                                        {/* Modulo oscuro general que reescribe de forma consolidada todos los costos, emulando ticket nativo estatico */}
                                        <div className="bg-orange-100/50 p-6 rounded-xl space-y-3 border border-orange-200">
                                            <div className="flex justify-between"><span>Subtotal</span><span>${totals.subtotal.toFixed(2)}</span></div>
                                            <div className="flex justify-between"><span>Envío ({orderType === 'pickup' ? 'Pickup' : (location.allowed ? location.zoneName : 'Por validar')})</span><span>${totals.shipping.toFixed(2)}</span></div>
                                            <div className="flex justify-between items-center">
                                                <span>Propina</span>
                                                <input type="number" placeholder="0" value={customer.tip} onChange={e => setCustomer({...customer, tip: e.target.value})} className="w-24 p-1 border rounded text-right" />
                                            </div>
                                            {totals.cardFee > 0 && <div className="flex justify-between font-bold text-purple-700"><span>Comisión</span><span>${totals.cardFee.toFixed(2)}</span></div>}
                                            <div className="flex justify-between font-black text-3xl pt-2 border-t border-orange-200"><span>TOTAL</span><span>${totals.finalTotal.toFixed(2)}</span></div>
                                        </div>
                                        
                                        <Button 
                                            onClick={handleCheckout} 
                                            disabled={!storeConfig.abierto} 
                                            className={`w-full py-5 text-xl shadow-xl ${storeConfig.abierto ? 'animate-pulse-glow' : 'bg-gray-400 opacity-60 cursor-not-allowed'}`} 
                                            icon={storeConfig.abierto ? Icons.Send : Icons.Clock}
                                        >
                                            {storeConfig.abierto ? 'ENVIAR PEDIDO' : 'TIENDA CERRADA'}
                                        </Button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                    
                    {/* Boton UI encapsulado con comportamiento fixed bottom y renderizado condicionado por metrica reducida de total items en state cart */}
                    {cart.length > 0 && ( 
                        <div className="fixed bottom-6 w-full px-4 sm:px-6 left-1/2 transform -translate-x-1/2 z-50 max-w-4xl mx-auto flex justify-end pointer-events-none">
                            <button onClick={() => { setShowCart(!showCart); if(!showCart) setTimeout(() => document.getElementById('cart')?.scrollIntoView({ behavior: 'smooth' }), 100); else window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="pointer-events-auto bg-gray-900/90 backdrop-blur-xl text-white pl-5 pr-6 py-4 rounded-full shadow-[0_20px_40px_rgba(0,0,0,0.5)] hover:scale-105 active:scale-95 flex items-center gap-4 border border-white/10 transition-all duration-300 group">
                                <div className="relative flex items-center">
                                    <div className="bg-brandPrimary p-2.5 rounded-full text-white group-hover:rotate-12 transition-transform shadow-[0_0_15px_rgba(var(--color-primary),0.6)]">
                                        <Icons.Cart size={24} />
                                    </div>
                                    <span className={`absolute -top-3 -right-3 font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-lg transition-all duration-300 ${cartAnimate ? 'bg-yellow-400 text-black scale-125 rotate-12' : 'bg-red-600 text-white scale-100 rotate-0 text-xs'}`}>{cart.reduce((a,c) => a + c.qty, 0)}</span>
                                </div>
                                <div className="border-l-2 border-orange-400 pl-3 flex flex-col items-start leading-none">
                                    <span className="text-[10px] font-bold text-orange-200 uppercase tracking-wider">Ver pedido</span>
                                    <span className="font-black text-lg">${totals.subtotal.toFixed(2)}</span>
                                </div>
                            </button> 
                        </div>
                    )}
                    
                    {/* Controlador UI disparado por setTimeout para notificar mutaciones basicas a DB o error geolocalizado */}
                    {notification && ( 
                        <div className="fixed top-1/2 left-[5%] transform -translate-x-1/2 -translate-y-1/2 bg-gray-900/95 backdrop-blur-md text-white px-8 py-6 rounded-2xl shadow-2xl z-[9999] flex flex-col items-center justify-center gap-4 text-xl font-bold animate-fade-in-down border border-gray-700 text-center min-w-[300px] max-w-[90%]">
                            <div className="bg-green-500 rounded-full p-2 animate-bounce"><Icons.Check size={32} className="text-white" /></div>
                            {notification}
                        </div> 
                    )}

                    {/* Pop-up condicionado por configuracion de store para incrementar total de pedido medio via up-selling (comercial) */}
                    {showDrinkUpsell && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in-down">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                                <div className="text-6xl mb-4">🥤</div>
                                <p className="text-gray-600 text-lg mb-8 leading-relaxed">{storeConfig.upsell_config?.message}</p>
                                <div className="flex flex-col gap-4">
                                    <button onClick={() => { setShowDrinkUpsell(false); setShowCart(false); setActiveCategory(storeConfig.upsell_config?.targetCategoryName); setTimeout(() => document.getElementById(`cat-${storeConfig.upsell_config?.targetCategoryName}`)?.scrollIntoView({ behavior: 'smooth' }), 100); }} className="w-full py-4 rounded-xl bg-blue-500 text-white font-bold shadow-lg shadow-blue-500/30 hover:bg-blue-600 active:scale-95 transition-all text-lg flex justify-center items-center gap-2">{storeConfig.upsell_config?.buttonText}</button>
                                    <button onClick={() => { setShowDrinkUpsell(false); setShowWaitModal(true); }} className="w-full py-4 rounded-xl border-2 border-gray-200 text-gray-500 font-bold hover:bg-gray-50 active:scale-95 transition-all">Enviar mi pedido sin bebidas</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Pantalla modal final encargada de comunicar con WhatsApp como plan B en caso de cierre de socket (Promise.race resolutor) */}
                    {showWaitModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in-down">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500"></div>
                                
                                {whatsappFallbackUrl ? (
                                    <div className="animate-fade-in-down">
                                        <div className="text-6xl mb-4">✅</div>
                                        <h3 className="text-2xl font-black text-gray-900 mb-2 uppercase">¡Pedido Generado!</h3>
                                        <p className="text-gray-600 mb-6">Te estamos redirigiendo a WhatsApp para confirmar...</p>
                                        <div className="bg-orange-50 border border-orange-200 p-4 rounded-xl mb-6">
                                            <p className="text-sm text-gray-700 font-bold mb-2">¿No se abrió WhatsApp automáticamente?</p>
                                            <p className="text-xs text-gray-500 mb-4">(Suele pasar si abriste el menú desde Facebook o tu red es lenta)</p>
                                            <a href={whatsappFallbackUrl} target="_blank" onClick={closeWaitModal} className="block w-full py-4 rounded-xl bg-green-500 text-white font-bold shadow-lg shadow-green-500/30 hover:scale-105 active:scale-95 transition-all text-lg">💬 Enviar por WhatsApp</a>
                                        </div>
                                        <button onClick={closeWaitModal} className="text-gray-400 underline text-sm">Cerrar y Volver al Menú</button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="mx-auto mb-6 relative">
                                            <div className="absolute inset-0 bg-orange-500 blur-xl opacity-20 rounded-full"></div>
                                            <img src={storeConfig.logo_url} className="w-32 h-32 rounded-full mx-auto shadow-xl border-4 border-white relative z-10 object-cover" />
                                        </div>
                                        <h3 className="text-2xl font-black text-gray-900 mb-2 tracking-tight uppercase">¡YA CASI, SOLO CONFIRMA TU PEDIDO POR WHATSAPP!</h3>
                                        <p className="text-gray-800 text-lg mb-8 leading-relaxed">
                                            {orderType === 'delivery' ? (
                                                <>🚨 ESTIMADO CLIENTE: 🕗 EL TIEMPO DE ESPERA es de 60 a 80 minutos 🚨<br/><br/><span className="text-sm font-bold text-gray-600 uppercase tracking-widest">¡Le agradecemos su PACIENCIA Y PREFERENCIA! 🙏</span></>
                                            ) : (
                                                <>🚨 ESTIMADO CLIENTE: NOSOTROS LE AVISAREMOS via WhatsApp cuando su pedido esté listo para recoger! 🚨<br/><br/><span className="text-sm font-bold text-gray-400 uppercase tracking-widest">¡Gracias por su PACIENCIA Y PREFERENCIA! 🙏</span></>
                                            )}
                                        </p>
                                        <div className="flex flex-col sm:flex-row gap-4">
                                            <button disabled={isSubmitting} onClick={closeWaitModal} className={`flex-1 py-4 rounded-xl border-2 font-bold transition-all ${isSubmitting ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-gray-700 hover:border-gray-300'}`}>Cancelar</button>
                                            <button disabled={isSubmitting} onClick={confirmAndSend} className={`flex-1 py-4 rounded-xl text-white font-bold shadow-xl transition-all flex justify-center items-center gap-2 ${isSubmitting ? 'bg-gray-400 cursor-not-allowed shadow-none' : 'bg-gradient-to-r from-orange-500 to-red-600 shadow-orange-500/30 hover:scale-105 active:scale-95'}`}>
                                                {submitText}
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        // Cierre de inicializacion virtual al DOM nativo del navegador
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
