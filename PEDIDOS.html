    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in-down { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slide-up { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-down { animation: fade-in-down 0.3s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }

    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useEffect, useMemo, useCallback, memo } = React;

        // ✅ LLAVE PÚBLICA (ANON_KEY) - ES SEGURO DEJARLA AQUÍ
        const SUPABASE_URL = 'https://uzpinrjzbucoihxuvdvm.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6cGlucmp6YnVjb2loeHV2ZHZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxNzEyNDgsImV4cCI6MjA3OTc0NzI0OH0.1bIIem8dU3VN-A8AH81smAt584zUD-Yf977MSUIEP2w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CONFIGURACIÓN CENTRALIZADA DEL NEGOCIO
        const CONFIG = {
            storeName: "HUARACHES LA 18",
            phone: "5215625264945",
            cardFeePercent: 0.035,
            storeLocation: { lat: 19.308249, lng: -99.081290 }, 
            assets: { logo: "/LOGO1.jpg" },
            deliveryTiers: [
                { maxDistance: 0.45, cost: 10.00, name: "Dentro de la Colonia" },
                { maxDistance: 1.00, cost: 15.00, name: "Dentro del rango" },
                { maxDistance: 14.80, cost: 20.00, name: "Dentro del rango" }
            ],
            maxDeliveryRadius: 14.80 
        };

        const calculateDistance = (lat1, lon1, lat2, lon2) => { const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180; const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2); const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c; };
        
        const getAvailableToppings = (category, itemName) => { const cat = category || ""; const item = itemName || ""; if (cat === 'Bebidas') return []; if (cat === 'Huaraches' || cat === 'Gorditas') return ['Cebolla', 'Queso Rallado']; if (cat === 'Sopes') return ['Cebolla', 'Queso Rallado', 'Lechuga']; if (cat === 'Tostadas' || cat === 'Pambazos') return ['Queso Rallado', 'Crema', 'Lechuga']; if (cat === 'Tortas') return ['Cebolla', 'Cilantro']; if (cat === 'Tacos') return ['Cebolla', 'Cilantro', 'Nopales']; if (cat === 'Quesadillas') return ['Lechuga', 'Queso']; if (cat === 'Burritos y Costras') { if (item.includes('Costra')) return ['Cebolla', 'Cilantro', 'Nopales']; return ['Nopales', 'Pepinos', 'Frijol', 'Cebolla Caramelizada', 'Lechuga']; } return []; };
        
        const Icon = memo(({ d, size = 28, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d={d} /></svg>));
        const Icons = {Cart: (p) => <svg {...p} width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>, Map: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>, Check: (p) => <Icon {...p} d="M20 6L9 17l-5-5" />, Plus: (p) => <Icon {...p} d="M12 5v14M5 12h14" />, Minus: (p) => <Icon {...p} d="M5 12h14" />, Send: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>, Info: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>, Cash: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><line x1="12" y1="7" x2="12" y2="21"></line><path d="M16.5 13.5h.01"></path><path d="M7.5 13.5h.01"></path></svg>, Phone: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>, Card: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>, Search: (p) => <svg {...p} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>, Clock: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>, X: (p) => <svg {...p} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>, Bag: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>, Moto: (p) => <svg {...p} width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> };
        const Button = memo(({ onClick, children, variant = "primary", className = "", disabled = false, icon: IconComp }) => { const variants = { primary: "bg-gradient-to-r from-orange-500 to-red-600 text-white shadow-lg shadow-orange-500/40 active:scale-95 hover:brightness-110 disabled:opacity-50 disabled:pointer-events-none", secondary: "bg-gray-800 text-white hover:bg-gray-700", danger: "bg-red-100 text-red-800 border border-red-200" }; return ( <button type="button" onClick={onClick} disabled={disabled} className={`px-6 py-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all text-lg ${variants[variant]} ${className}`}> {IconComp && <IconComp size={28} />} {children} </button> ); });
        
        const ProductItem = memo(({ item, category, onAdd }) => {
            const [withQuesillo, setWithQuesillo] = useState(false);
            const [conTodo, setConTodo] = useState(true);
            const [exclusions, setExclusions] = useState({});
            const isAvailable = item.disponible;
            const quesilloExtraPrecio = parseFloat(item.quesillo_extra_precio || 0);
            const hasExtra = quesilloExtraPrecio > 0 && isAvailable;
            const currentPrice = hasExtra && withQuesillo ? parseFloat(item.precio) + quesilloExtraPrecio : parseFloat(item.precio);
            const availableToppings = useMemo(() => getAvailableToppings(category, item.nombre), [category, item.nombre]);
            useEffect(() => { setConTodo(true); setExclusions({}); }, [item.nombre]);
            const toggleConTodo = useCallback(() => { if (!conTodo) { setConTodo(true); setExclusions({}); } }, [conTodo]);
            const toggleExclusion = useCallback((topping) => { setExclusions(prev => { const newState = !prev[topping]; const newExclusions = { ...prev, [topping]: newState }; const anyExcluded = Object.values(newExclusions).some(val => val === true); setConTodo(!anyExcluded); return newExclusions; }); }, []);
            const handleAdd = useCallback(() => { let details = ""; const activeExclusions = Object.entries(exclusions).filter(([_, isExcluded]) => isExcluded).map(([name]) => name); if (availableToppings.length === 0) details = ""; else if (conTodo) details = " (Con Todo)"; else if (activeExclusions.length === availableToppings.length) details = " (SIN NADA / SOLO)"; else if (activeExclusions.length > 0) details = ` (SIN ${activeExclusions.join(', SIN ')})`; else details = " (Con Todo)"; onAdd({ ...item, name: item.nombre, price: currentPrice, isExtra: withQuesillo, details: details }); }, [exclusions, conTodo, availableToppings, onAdd, item, currentPrice, withQuesillo]);

            return (
                <div className={`bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col animate-slide-up h-full ${!isAvailable ? 'opacity-60 bg-gray-100' : ''}`}>
                    <div className="p-2 flex-grow">
                        <div className="flex justify-between items-start mb-4">
                            <h3 className="font-bold text-gray-900 text-xl leading-tight">{item.nombre}</h3>
                            <div className="flex flex-col items-end">
                                <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded-lg font-bold text-lg whitespace-nowrap ml-2">${currentPrice.toFixed(2)}</span>
                                {!isAvailable && <span className="text-xs bg-red-600 text-white px-2 py-1 rounded mt-1 font-bold">AGOTADO</span>}
                            </div>
                        </div>
                        {isAvailable && availableToppings.length > 0 && (
                            <div className="mb-4 flex flex-col gap-2">
                                <p className='text-sm text-gray-500 mb-1 font-semibold'>Personaliza tu orden:</p>
                                <label className="flex items-center gap-3 text-base font-bold text-gray-900 cursor-pointer select-none p-2 rounded bg-orange-50 border border-orange-200 hover:bg-orange-100 transition-colors"><input type="checkbox" checked={conTodo} onChange={toggleConTodo} className="w-5 h-5 rounded accent-orange-600" />Con Todo</label>
                                <div className="grid grid-cols-2 gap-2 mt-1">{availableToppings.map(t => ( <label key={t} className={`flex items-center gap-2 text-sm cursor-pointer select-none p-2 rounded border transition-colors ${exclusions[t] ? 'bg-red-50 border-red-200 text-red-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'}`}><input type="checkbox" checked={exclusions[t] || false} onChange={() => toggleExclusion(t)} className="w-4 h-4 rounded accent-red-600" />Sin {t}</label> ))}</div>
                            </div>
                        )}
                        {hasExtra && ( <div onClick={() => setWithQuesillo(!withQuesillo)} role="button" tabIndex="0" className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer mb-4 transition-all ${withQuesillo ? 'border-orange-500 bg-orange-50 ring-1 ring-orange-500' : 'border-gray-200 bg-gray-50 hover:bg-gray-100'}`}><div className={`w-6 h-6 rounded border flex items-center justify-center ${withQuesillo ? 'bg-orange-500 border-orange-500' : 'bg-white border-gray-400'}`}>{withQuesillo && <Icons.Check size={16} className="text-white" />}</div><span className="text-base font-medium text-gray-800">Quesillo Extra (+${quesilloExtraPrecio})</span></div> )}
                    </div>
                    <div className="p-4 pt-0 mt-auto"><Button onClick={handleAdd} disabled={!isAvailable} className="w-full text-lg py-3 hover:brightness-110 active:scale-95" icon={Icons.Plus}>{isAvailable ? 'Agregar' : 'No disponible'}</Button></div>
                </div>
            );
        });

        const App = () => {
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isStandalone, setIsStandalone] = useState(false);
            const [isIOS, setIsIOS] = useState(false);

            useEffect(() => {
                const userAgent = window.navigator.userAgent.toLowerCase();
                setIsIOS(/iphone|ipad|ipod/.test(userAgent));
                setIsStandalone(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
                const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            const handleInstallClick = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setDeferredPrompt(null);
            };

            const [whatsappFallbackUrl, setWhatsappFallbackUrl] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitText, setSubmitText] = useState("Confirmar por WhatsApp");
            const [cartAnimate, setCartAnimate] = useState(false);
            const [categoriesDB, setCategoriesDB] = useState([]);
            const [menuItemsDB, setMenuItemsDB] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [cart, setCart] = useState([]);
            const [activeCategory, setActiveCategory] = useState("");
            const [showCart, setShowCart] = useState(false);
            const [notification, setNotification] = useState(null);
            const [location, setLocation] = useState({ lat: null, lng: null, status: 'idle', shippingCost: 0, zoneName: '', distance: 0, allowed: false });
            
            const [customer, setCustomer] = useState(() => {
                const savedClient = localStorage.getItem('huarachesCliente');
                if (savedClient) return { ...JSON.parse(savedClient), salsa: '', paymentAmount: '', instructions: '', tip: '' };
                return { name: '', phone: '', salsa: '', paymentMethod: '', paymentAmount: '', instructions: '', tip: '' };
            });

            useEffect(() => {
                localStorage.setItem('huarachesCliente', JSON.stringify({ name: customer.name, phone: customer.phone, paymentMethod: customer.paymentMethod }));
            }, [customer.name, customer.phone, customer.paymentMethod]);

            const [searchTerm, setSearchTerm] = useState("");
            const [showWaitModal, setShowWaitModal] = useState(false);
            const [showDrinkUpsell, setShowDrinkUpsell] = useState(false);
            const [isOpen, setIsOpen] = useState(true); 
            const [orderType, setOrderType] = useState(null);
            const [connectionError, setConnectionError] = useState(false);

            useEffect(() => {
                const fetchStoreStatus = async () => {
                    const { data } = await supabase.from('config_tienda').select('abierto').eq('id', 1).single();
                    if (data) setIsOpen(data.abierto);
                };
                fetchStoreStatus();

                const channel = supabase.channel('tienda_en_vivo')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'config_tienda' }, payload => {
                        if (payload.new && typeof payload.new.abierto !== 'undefined') setIsOpen(payload.new.abierto);
                    }).subscribe();
                    
                return () => { supabase.removeChannel(channel); };
            }, []);

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const { data: cats, error: errCats } = await supabase.from('categorias').select('*').order('orden', { ascending: true });
                        if (errCats) throw errCats;
                        
                        const { data: items, error: errItems } = await supabase.from('menu_items').select('*');
                        if (errItems) throw errItems;
                        
                        setCategoriesDB(cats); 
                        setMenuItemsDB(items);
                        if (cats.length > 0) setActiveCategory(cats[0].nombre);
                    } catch (error) { 
                        console.error("Error cargando menú DB:", error); 
                        setConnectionError(true);
                    } finally { 
                        setIsLoading(false); 
                    }
                };
                
                fetchData();

                const channel = supabase.channel('menu_en_vivo')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'menu_items' }, (payload) => {
                        setMenuItemsDB(prevItems => prevItems.map(item => item.id === payload.new.id ? payload.new : item));
                    })
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'menu_items' }, (payload) => {
                        setMenuItemsDB(prevItems => [...prevItems, payload.new]);
                    })
                    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'menu_items' }, (payload) => {
                        setMenuItemsDB(prevItems => prevItems.filter(item => item.id !== payload.old.id));
                    }).subscribe(); 
                    
                return () => { supabase.removeChannel(channel); }; 
            }, []);

            useEffect(() => { const saved = localStorage.getItem('huarachesDeliveryCart'); if (saved) try { setCart(JSON.parse(saved)); } catch (e) {} }, []);
            useEffect(() => { localStorage.setItem('huarachesDeliveryCart', JSON.stringify(cart)); }, [cart]);

            const showNotification = useCallback((msg) => { setNotification(msg); setTimeout(() => setNotification(null), 2500); }, []); 
            const addToCart = useCallback((product) => { 
                const key = `${product.nombre}-${product.price}-${product.details}-${product.isExtra}`; 
                setCart(prev => { 
                    const existingIndex = prev.findIndex(p => p.key === key); 
                    if (existingIndex > -1) { 
                        const newCart = [...prev]; 
                        newCart[existingIndex].qty += 1; 
                        return newCart; 
                    } 
                    return [...prev, { ...product, qty: 1, key }]; 
                }); 
                showNotification(`¡${product.nombre}${product.isExtra ? " (con Quesillo)" : ""} agregado!`); 
                setCartAnimate(true); setTimeout(() => setCartAnimate(false), 300);
            }, [showNotification]);
            const updateQty = useCallback((key, delta) => { setCart(prev => prev.map(p => p.key === key ? { ...p, qty: Math.max(0, p.qty + delta) } : p).filter(p => p.qty > 0)); }, []);

            const getLocation = () => {
                if (!navigator.geolocation) return setLocation(prev => ({ ...prev, status: 'error' }));
                if(!confirm(`📍 Huaraches La 18 calculará la distancia de entrega.\n\nACEPTAR para continuar.`)) return;
                setLocation(prev => ({ ...prev, status: 'loading' }));
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const userLat = pos.coords.latitude; const userLng = pos.coords.longitude;
                        const distKm = calculateDistance(CONFIG.storeLocation.lat, CONFIG.storeLocation.lng, userLat, userLng);
                        if (distKm > CONFIG.maxDeliveryRadius) {
                            setLocation({ lat: userLat, lng: userLng, status: 'success', allowed: false, shippingCost: 0, zoneName: 'Fuera de rango', distance: distKm });
                            alert(`⚠️ FUERA DE COBERTURA\n\nEstás a ${distKm.toFixed(2)} km. Nuestro límite máximo es de ${CONFIG.maxDeliveryRadius} km.\n\nPuedes continuar si cambias tu pedido a "Pickup".`);
                            return;
                        }
                        const matchedTier = CONFIG.deliveryTiers.find(tier => distKm <= tier.maxDistance);
                        if (matchedTier) {
                            setLocation({ lat: userLat, lng: userLng, status: 'success', allowed: true, shippingCost: matchedTier.cost, zoneName: matchedTier.name, distance: distKm });
                            const distMsg = distKm < 1 ? `${(distKm * 1000).toFixed(0)} metros` : `${distKm.toFixed(2)} km`;
                            showNotification(`✅ Estás a ${distMsg}. Tarifa: $${matchedTier.cost}`);
                        } else {
                            setLocation({ lat: userLat, lng: userLng, status: 'success', allowed: false, shippingCost: 0, zoneName: 'Error de rango', distance: distKm });
                            alert(`⚠️ Algo salió mal al calcular la tarifa para tu distancia.`);
                        }
                    },
                    (err) => { setLocation(prev => ({ ...prev, status: 'error' })); showNotification("⚠️ No pudimos obtener tu ubicación exacta."); },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 300000 }
                );
            };

            const totals = useMemo(() => { 
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0); 
                const tip = parseFloat(customer.tip) || 0; 
                const shipping = orderType === 'pickup' ? 0 : (location.allowed ? location.shippingCost : 0);
                let baseTotal = subtotal + shipping + tip; 
                const cardFee = customer.paymentMethod === 'tarjeta' ? baseTotal * CONFIG.cardFeePercent : 0; 
                return { subtotal, tip, cardFee, shipping, finalTotal: baseTotal + cardFee }; 
            }, [cart, customer.tip, customer.paymentMethod, orderType, location.allowed, location.shippingCost]);

            const openWaitModal = () => { setWhatsappFallbackUrl(null); setIsSubmitting(false); setSubmitText("Confirmar por WhatsApp"); setShowWaitModal(true); };
            const closeWaitModal = () => { setShowWaitModal(false); setIsSubmitting(false); setSubmitText("Confirmar por WhatsApp"); setWhatsappFallbackUrl(null); };

            const handleCheckout = async () => {
                if (orderType === 'delivery') {
                    if (totals.subtotal < 100) return showNotification(`⚠️ El pedido mínimo para domicilio es de $100`);
                    if (location.status === 'idle') return showNotification("⚠️ Por favor valida tu ubicación antes de pedir");
                    if (!location.allowed) return showNotification("⚠️ Estás fuera de nuestra zona de entrega a domicilio");
                }
                const telefonoLimpio = customer.phone.replace(/[^0-9]/g, '');
                if (!customer.name || !telefonoLimpio || !customer.salsa || !customer.paymentMethod || cart.length === 0) return showNotification("⚠️ Faltan datos obligatorios para procesar tu pedido");

                if (customer.paymentMethod === 'efectivo') {
                    const payAmount = parseFloat(customer.paymentAmount) || 0;
                    if (payAmount < totals.finalTotal) return showNotification(`⚠️ Si pagas en efectivo, el monto debe ser de al menos $${totals.finalTotal.toFixed(2)}`);

                if (!cart.some(item => item.categoria_id === 10)) { setShowDrinkUpsell(true); return; }
                openWaitModal();
            };

            const confirmAndSend = async () => {
                if (isSubmitting) return; 
                setIsSubmitting(true); setSubmitText("🔐 Guardando pedido...");

                let subtotalSeguro = 0;
                try {
                    const cartIds = [...new Set(cart.map(item => item.id))];
                    const fetchWithTimeout = Promise.race([
                        supabase.from('menu_items').select('id, precio, quesillo_extra_precio').in('id', cartIds),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2000))
                    ]);
                    const { data: dbItems, error } = await fetchWithTimeout.catch(() => ({ data: null, error: true }));

                    if (!error && dbItems) {
                        cart.forEach(cartItem => {
                            const realItem = dbItems.find(dbI => dbI.id === cartItem.id);
                            if (realItem) {
                                const precioBase = parseFloat(realItem.precio);
                                const precioQuesillo = cartItem.isExtra ? parseFloat(realItem.quesillo_extra_precio || 0) : 0;
                                subtotalSeguro += (precioBase + precioQuesillo) * cartItem.qty;
                            } else { subtotalSeguro += (cartItem.price * cartItem.qty); }
                        });
                    } else { subtotalSeguro = totals.subtotal; }
                } catch (error) { subtotalSeguro = totals.subtotal; }

                const shippingSeguro = orderType === 'pickup' ? 0 : (location.allowed ? location.shippingCost : 0);
                const tipSeguro = parseFloat(customer.tip) || 0;
                let baseTotalSeguro = subtotalSeguro + shippingSeguro + tipSeguro;
                const cardFeeSeguro = customer.paymentMethod === 'tarjeta' ? baseTotalSeguro * CONFIG.cardFeePercent : 0;
                const finalTotalSeguro = baseTotalSeguro + cardFeeSeguro;
                const latitud = location.lat ? parseFloat(location.lat) : 0;
                const longitud = location.lng ? parseFloat(location.lng) : 0;
                const title = orderType === 'pickup' ? "PEDIDO PICKUP" : "PEDIDO A DOMICILIO";
                
                const E_FIRE = decodeURIComponent('%F0%9F%94%A5'); const E_USER = decodeURIComponent('%F0%9F%91%A4'); const E_PHONE = decodeURIComponent('%F0%9F%93%B1'); const E_CHILI = decodeURIComponent('%F0%9F%8C%B6%EF%B8%8F'); const E_CHECK = decodeURIComponent('%E2%9C%85'); const E_NOTE = decodeURIComponent('%F0%9F%93%9D'); const E_MOTO = decodeURIComponent('%F0%9F%9B%B5'); const E_MONEY = decodeURIComponent('%F0%9F%92%B0'); const E_PIN = decodeURIComponent('%F0%9F%93%8D');
                
                let msg = `${E_FIRE} *${title}* ${E_FIRE}\n\n${E_USER} *Cliente:* ${customer.name}\n${E_PHONE} *Tel:* ${customer.phone}\n${E_CHILI} *Salsa:* ${customer.salsa}\n--------------------\n\n`;
                cart.forEach(item => { msg += `${E_CHECK} *${item.qty}* *x* *${item.nombre}* ${item.isExtra ? '(c/Quesillo)' : ''} ${item.details || ''}- $${(item.price * item.qty).toFixed(2)}\n`; });
                if (customer.instructions) msg += `\n\n${E_NOTE} *Notas:* ${customer.instructions}`;
                msg += `\n--------------------\nSubtotal: $${subtotalSeguro.toFixed(2)}\n\n`;
                if (orderType === 'delivery') msg += `${E_MOTO} Envío: $${shippingSeguro.toFixed(2)} ${location.zoneName ? '('+location.zoneName+')' : ''}\n\n`; else msg += `Pickup: Sin costo de envío \n\n`;
                if (tipSeguro > 0) msg += `Propina: *$${tipSeguro.toFixed(2)}*\n\n`;
                
                let pagoInfo = "";
                if (customer.paymentMethod === 'efectivo') {
                    const pagoCon = parseFloat(customer.paymentAmount) || 0;
                    const cambio = pagoCon - finalTotalSeguro;
                    pagoInfo = `*EFECTIVO*\n\n *Con: $${pagoCon}*\n *Cambio: $${cambio > 0 ? cambio.toFixed(2) : '0.00'}*\n\n`;
                } else { pagoInfo = customer.paymentMethod.toUpperCase(); }

                msg +=`${E_MONEY} *TOTAL: $${finalTotalSeguro.toFixed(2)}*\n\n*Pago:* ${pagoInfo}`;
                if (orderType === 'delivery') {
                    if (latitud !== 0 && longitud !== 0) msg += `\n${E_PIN} *DIRECCIÓN DE ENTREGA:*\n https://www.google.com/maps/search/?api=1&query=${latitud},${longitud}`;
                    else msg += `\n⚠️ Ubicación: PENDIENTE (Enviar por chat)`;
                }

                const whatsappUrl = `https://wa.me/${CONFIG.phone}?text=${encodeURIComponent(msg)}`;
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                let preOpenedWindow = null; if (!isMobile) preOpenedWindow = window.open('', '_blank');

                try {
                    const insertPromise = supabase.from('pedidos').insert([{ 
                        cliente_nombre: customer.name, cliente_telefono: customer.phone, total: finalTotalSeguro, metodo_pago: customer.paymentMethod, detalle_json: cart, status: 'pendiente', lat: latitud, lng: longitud, repartidor: null, pago_con: customer.paymentMethod === 'efectivo' ? parseFloat(customer.paymentAmount) : null, salsa: customer.salsa, nota: customer.instructions, envio: shippingSeguro, propina: tipSeguro
                    }]);

                    await Promise.race([insertPromise, timeoutPromise]);
                } catch(err) { console.error("⚠️ Error guardando pedido en BD", err); }

                setCart([]); localStorage.removeItem('huarachesDeliveryCart'); setShowCart(false);
                setWhatsappFallbackUrl(whatsappUrl); setSubmitText("¡Listo! Redirigiendo...");

            };

                if (!categoriesDB.length) return [];

                return activeCats.map(cat => {

                        const nameA = a.nombre.toLowerCase(); const nameB = b.nombre.toLowerCase();
                        if (cat.nombre === 'Burritos y Costras') { const getWeight = (n) => { if (n.includes('burrito')) return 1; if (n.includes('costra')) return 2; return 3; }; return getWeight(nameA) - getWeight(nameB) || a.orden - b.orden; }
                        if (cat.nombre === 'Bebidas') { const getDrinkWeight = (n) => { if (n.includes('jamaica')) return 1; if (n.includes('horchata')) return 2; if (n.includes('ponche')) return 3; return 10; }; return getDrinkWeight(nameA) - getDrinkWeight(nameB) || a.orden - b.orden; }
                        const getWeight = (n) => { if (n.includes('sencillo')) return 1; if (n.includes('quesillo')) return 2; if (n.includes('huevo')) return 3; return 10; };

                        return a.orden - b.orden;

                                                <div className="flex justify-between font-black text-3xl pt-2 border-t border-orange-200"><span>TOTAL</span><span>${totals.finalTotal.toFixed(2)}</span></div>
                                            </div>
                                            <Button onClick={handleCheckout} disabled={!isOpen} className={`w-full py-5 text-xl shadow-xl ${isOpen ? 'animate-pulse-glow' : 'bg-gray-400 opacity-60 cursor-not-allowed'}`} icon={isOpen ? Icons.Send : Icons.Clock}>{isOpen ? 'ENVIAR PEDIDO' : 'CERRADO (Abre 6:20 PM)'}</Button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                    
                    {cart.length > 0 && ( <button onClick={() => { if (showCart) { setShowCart(false); window.scrollTo({ top: 0, behavior: 'smooth' }); } else { setShowCart(true); setTimeout(() => document.getElementById('cart')?.scrollIntoView({ behavior: 'smooth' }), 100); } }} className="fixed bottom-6 right-4 sm:right-6 bg-gradient-to-r from-orange-500 to-orange-600 text-white px-5 py-3 rounded-full shadow-2xl z-50 hover:scale-105 transition-transform border-4 border-white active:scale-95 flex items-center gap-3"><div className="relative flex items-center"><Icons.Cart size={28} /><span className={`absolute -top-3 -right-3 font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-lg transition-all duration-300 ${cartAnimate ? 'bg-yellow-400 text-black scale-125 rotate-12' : 'bg-red-600 text-white scale-100 rotate-0 text-xs'}`}>{cart.reduce((a,c) => a + c.qty, 0)}</span></div><div className="border-l-2 border-orange-400 pl-3 flex flex-col items-start leading-none"><span className="text-[10px] font-bold text-orange-200 uppercase tracking-wider">Ver pedido</span><span className="font-black text-lg">${totals.subtotal.toFixed(2)}</span></div></button> )}
                    {notification && ( <div className="fixed top-1/2 left-[5%] transform -translate-x-1/2 -translate-y-1/2 bg-gray-900/95 backdrop-blur-md text-white px-8 py-6 rounded-2xl shadow-2xl z-[9999] flex flex-col items-center justify-center gap-4 text-xl font-bold animate-fade-in-down border border-gray-700 text-center min-w-[300px] max-w-[90%]"><div className="bg-green-500 rounded-full p-2 animate-bounce"><Icons.Check size={32} className="text-white" /></div>{notification}</div> )}
                    {showDrinkUpsell && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in-down"><div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center relative overflow-hidden"><div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div><div className="text-6xl mb-4">🥤</div><p className="text-gray-600 text-lg mb-8 leading-relaxed">¿Quiere agregar un Agua de Horchata, Jamaica o un Refresco para acompañar?</p><div className="flex flex-col gap-4"><button onClick={() => { setShowDrinkUpsell(false); setShowCart(false); setActiveCategory('Bebidas'); setTimeout(() => document.getElementById('cat-10')?.scrollIntoView({ behavior: 'smooth' }), 100); }} className="w-full py-4 rounded-xl bg-blue-500 text-white font-bold shadow-lg shadow-blue-500/30 hover:bg-blue-600 active:scale-95 transition-all text-lg flex justify-center items-center gap-2">🥤 Ver bebidas</button><button onClick={() => { setShowDrinkUpsell(false); openWaitModal(); }} className="w-full py-4 rounded-xl border-2 border-gray-200 text-gray-500 font-bold hover:bg-gray-50 hover:text-gray-700 active:scale-95 transition-all">Enviar mi pedido sin bebidas</button></div></div></div>
                    )}
                    {showWaitModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in-down"><div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center relative overflow-hidden"><div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500"></div>{whatsappFallbackUrl ? ( <div className="animate-fade-in-down"><div className="text-6xl mb-4">✅</div><h3 className="text-2xl font-black text-gray-900 mb-2 uppercase">¡Pedido Generado!</h3><p className="text-gray-600 mb-6">Te estamos redirigiendo a WhatsApp para confirmar...</p><div className="bg-orange-50 border border-orange-200 p-4 rounded-xl mb-6"><p className="text-sm text-gray-700 font-bold mb-2">¿No se abrió WhatsApp automáticamente?</p><p className="text-xs text-gray-500 mb-4">(Suele pasar si abriste el menú desde Facebook o tu red es lenta)</p><a href={whatsappFallbackUrl} target="_blank" rel="noopener noreferrer" onClick={closeWaitModal} className="block w-full py-4 rounded-xl bg-green-500 text-white font-bold shadow-lg shadow-green-500/30 hover:scale-105 active:scale-95 transition-all text-lg">💬 Enviar por WhatsApp</a></div><button onClick={closeWaitModal} className="text-gray-400 underline text-sm">Cerrar y Volver al Menú</button></div> ) : ( <><div className="mx-auto mb-6 relative"><div className="absolute inset-0 bg-orange-500 blur-xl opacity-20 rounded-full"></div><img src={CONFIG.assets.logo} alt="Logo" className="w-32 h-32 rounded-full mx-auto shadow-xl border-4 border-white relative z-10 object-cover" /></div><h3 className="text-2xl font-black text-gray-900 mb-2 tracking-tight uppercase">¡YA CASI, SOLO CONFIRMA TU PEDIDO POR WHATSAPP!</h3><p className="text-gray-800 text-lg mb-8 leading-relaxed">{orderType === 'delivery' ? ( <>🚨 ESTIMADO CLIENTE: 🕗 EL TIEMPO DE ESPERA es de 60 a 80 minutos 🚨<br/><br/><span className="text-sm font-bold text-gray-600 uppercase tracking-widest">¡Le agradecemos su PACIENCIA Y PREFERENCIA! 🙏🌮</span></> ) : ( <>🚨 ESTIMADO CLIENTE: NOSOTROS LE AVISAREMOS via WhatsApp cuando su pedido esté listo para recoger! 🚨<br/><br/><span className="text-sm font-bold text-gray-400 uppercase tracking-widest">¡Gracias por su PACIENCIA Y PREFERENCIA! 🙏🌮</span></> )}</p><div className="flex gap-4"><button disabled={isSubmitting} onClick={closeWaitModal} className={`flex-1 py-4 rounded-xl border-2 font-bold transition-all ${isSubmitting ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-gray-700 hover:border-gray-300'}`}>Cancelar</button><button disabled={isSubmitting} onClick={confirmAndSend} className={`flex-1 py-4 rounded-xl text-white font-bold shadow-xl transition-all ${isSubmitting ? 'bg-gray-500 cursor-not-allowed shadow-none' : 'bg-gradient-to-r from-orange-500 to-red-600 shadow-orange-500/30 hover:scale-105 active:scale-95'}`}>{submitText}</button></div></> )}</div></div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
